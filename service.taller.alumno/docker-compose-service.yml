services:
  postgres-local:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: postgres-local-upc
    environment:
      POSTGRES_DB: db_upc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - upc-network
  mongodb:
    image: mongo:8
    platform: linux/amd64
    container_name: mongo-local-upc
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Sistemas123
      MONGO_INITDB_DATABASE: mongodb
    volumes:
      - mongo_data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d
    networks:
      - upc-network
  app-service:
    image: img-service-open-source:latest
    container_name: service-open-source-container
    environment:
      POSTGRES_HOST: postgres-local-cloud
      POSTGRES_PORT: "5432"
      POSTGRES_DB: db_upc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      MONGO_USER: admin
      MONGO_PASSWORD: Sistemas123
      MONGO_HOST: mongo-local-upc
      MONGO_PORT: 27017
      MONGO_DB: mongodb
      JWT_SECRET: secret-key-jwt-para-service-taller-alumno-minimo-32-caracteres
      JWT_ACCESS_TOKEN_EXPIRATION_MS: 900000
      JWT_REFRESH_TOKEN_EXPIRATION_MS: 604800000
    ports:
      - "80:8090"
    restart: unless-stopped
    networks:
      - upc-network

volumes:
  pgdata:
  mongo_data:

networks:
  upc-network:
    external: true
    name: java-upc-network